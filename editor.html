<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>content.js 本地编辑器</title>
  <link rel="stylesheet" href="./res/editor.css">
</head>
<body>
  <header class="toolbar">
    <div>
      <h1>content.js 编辑器</h1>
      <p class="muted">左右两栏可以选择同一种语言，用于对照编辑。</p>
    </div>
    <div class="toolbar-actions">
      <a href="/" target="_blank" rel="noopener">打开网站预览</a>
      <button id="reload-button" type="button">重新加载</button>
      <button id="save-button" type="button" disabled>保存</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">正在加载……</p>
  </header>
  <main id="panels" class="panels" aria-busy="true"></main>
  <template id="loading-template"><p class="loading">正在读取 content.js……</p></template>
  <script src="./res/third-party/marked.umd.min.js"></script>
  <script src="./res/editor.js"></script>
</body>
</html>
